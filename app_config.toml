[video]
source = "videos/VID_20260510_190118_088.mp4"
output = "output/VID_20260510_190118_088_processed.avi"
fps = 0.0
codec = "MJPG"
realtime_preview = false
preview_max_frame_drop = 0

[filters]
use_median = false
use_gaussian = false
median_kernel = 3
gaussian_kernel = [5, 5]

[background_model]
enabled = false
history = 500
var_threshold = 16.0
detect_shadows = true
learning_rate = -1.0
binary_threshold = 200
morph_kernel = 3
min_area = 80
draw_contours = false
show_mask = false
mask_alpha = 0.35
foreground_color = [0, 128, 255]
contour_color = [0, 255, 255]
contour_thickness = 2

[detection]
enabled_object_classes = ["person"]
model_path = "models/yolov8n.onnx"
model_input_size = [640, 640]
detect_full_frame = true
detection_regions = []
excluded_detection_regions = []
processing_stride = 4
detection_interval = 4
show_summary = false
confidence_threshold = 0.12
nms_threshold = 0.45
min_size = [4, 10]
person_min_aspect_ratio = 0.75
person_max_aspect_ratio = 6.5
person_min_area = 40
track_iou_threshold = 0.2
track_max_missed_cycles = 6
use_opencv_trackers = false
render_min_detection_hits = 1
render_high_confidence_threshold = 0.20
count_direction_crossings = true
count_line_x = 350
count_zone = [0, 0, 640, 528]
count_min_dx = 20
count_left_to_right_label = "Зліва направо"
count_right_to_left_label = "Справа наліво"
box_color = [255, 0, 0]
box_thickness = 2
font_scale = 0.7
font_path = "C:/Windows/Fonts/arial.ttf"

[detection.labels]
person = "Людина"
dog = "Собака"

[window]
processed_window_name = "Оброблене відео"
normal_max_height = 700
fullscreen_toggle_key = "f"
